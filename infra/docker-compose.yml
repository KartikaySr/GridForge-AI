services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: ${POSTGRES_DB:-gridforge}
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - gridforge_pg:/var/lib/postgresql/data
      - ../database/migrations/0001_core.sql:/docker-entrypoint-initdb.d/0001_core.sql:ro
      - ../database/migrations/0002_sync.sql:/docker-entrypoint-initdb.d/0002_sync.sql:ro
      - ../database/migrations/0003_ai_sync.sql:/docker-entrypoint-initdb.d/0003_ai_sync.sql:ro
      - ../database/migrations/0004_ai_reporting.sql:/docker-entrypoint-initdb.d/0004_ai_reporting.sql:ro
      - ../database/migrations/0005_ai_vectors.sql:/docker-entrypoint-initdb.d/0005_ai_vectors.sql:ro
volumes:
  gridforge_pg:
